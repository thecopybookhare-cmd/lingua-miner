name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Las versiones exactas de uv.lock, las mismas que reciben los usuarios.
      # --locked falla si alguien cambió pyproject.toml sin regenerar el lock.
      - name: Install deps (uv.lock)
        id: deps
        run: uv sync --locked --python 3.12

      - name: Lint (ruff)
        run: uv run --frozen ruff check app/ tests/

      # Corre aunque falle ruff: un error de lint escondió cuatro tests rotos
      # durante una semana (v1.33.0–v1.33.2), porque pytest nunca llegaba a correr.
      - name: Tests (pytest)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --frozen pytest tests/ -q
